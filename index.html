<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portal inventaris laboratorium Teknik Komputer">
  <title>WebLab - Inventaris Laboratorium</title>
</head>
<body id="top">
  <header>
    <a href="#main">Lewati ke konten utama</a>
    <h1>
      <!-- 1. GAMBAR SEBAGAI LINK -->
      <a href="#top">
        <img src="logo.png" alt="Kembali ke atas halaman WebLab" width="35">
      </a>
      WebLab
    </h1>
    <nav aria-label="Navigasi utama">
      <a href="#tentang">Tentang</a>
      <a href="#layanan">Layanan</a>
      <a href="#kontak">Kontak</a>
    </nav>
  </header>

  <main id="main">
    <!-- Section 1: Tentang -->
    <section id="tentang">
      <h2>Tentang Laboratorium</h2>
      <p>Pusat pengelolaan dan peminjaman perangkat laboratorium komputer.</p>
      <!-- 2. GAMBAR INFORMATIF 1 -->
      <img src="lab.jpg" alt="Foto suasana ruangan laboratorium komputer dengan deretan PC" width="400">
    </section>

    <!-- Section 2: Layanan & Article -->
    <section id="layanan">
      <h2>
        <!-- 3. GAMBAR DEKORATIF 1 -->
        <img src="ikonGerigi.png" alt="" width="24">
        Layanan Inventaris
      </h2>
      <article>
        <h3>Pencatatan Peralatan</h3>
        <p>
          <!-- 4. GAMBAR DEKORATIF 2 -->
          <img src="ikonList.png" alt="" width="18">
          Mencatat data alat dan status kondisi.
        </p>

        <!-- 5. GAMBAR INFORMATIF 2 -->
        <h4>Denah Tata Letak Laboratorium Komputer</h4>
        <img src="denah.jpg" alt="Denah tata letak lab: 20 PC di area tengah, meja instruktur di depan, dan lemari server di sisi kanan belakang" width="400">
      </article>
    </section>

    <!-- Section 3: Form Kontak -->
    <section id="kontak">
      <h2>Kontak</h2>
      <form>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
        <button type="submit">Kirim</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 WebLab</p>
  </footer>
</body>
</html>
